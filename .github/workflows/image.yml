name: Image

# Builds the Apprentice image from the pinned lock and runs the real Docker smoke test.
# Network is used only while building; the smoke test's workers run with --network=none.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "re_harness/case.py"
      - "re_harness/decoding.py"
      - "re_harness/policy.py"
      - "re_harness/providers.py"
      - "re_harness/worker.py"
      - "tests/smoke.py"
      - ".github/workflows/image.yml"

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build image and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Free runner disk for the Ghidra and capa layers
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /var/lib/docker
      - name: Provision the baseline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          STATIC_RE_STATE_DIR: ${{ runner.temp }}/state
        run: python -m re_harness.cli provision --engine linux
      - name: Smoke test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          STATIC_RE_STATE_DIR: ${{ runner.temp }}/state
        run: |
          set -o pipefail
          python -m tests.smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Verified the Forge landing page" "$RUNNER_TEMP/smoke.log"
