name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject agent configuration and credential files
        run: |
          set -eu
          pattern='(^|/)\.(codex|claude)/|(^|/)CLAUDE\.local\.md$|(^|/)forge\.env$|(^|/)\.env$|\.(pem|key|pfx|ovpn|htpasswd)$|(^|/)\.static-re-harness/'
          if git ls-files | grep -E "$pattern"; then
            echo "::error::Tracked files above must not be published. Remove them from the index."
            exit 1
          fi

  host-tests:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-2025
            python: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile sources
        run: python -m compileall -q re_harness tests
      - name: Unit, boundary and Forge tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
