name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject agent configuration and credential files
        run: |
          set -eu
          pattern='(^|/)\.(codex|claude)/|(^|/)CLAUDE\.local\.md$|(^|/)forge\.env$|(^|/)\.env$|\.(pem|key|pfx|ovpn|htpasswd)$|(^|/)\.static-re-harness/'
          if git ls-files | grep -E "$pattern"; then
            echo "::error::Tracked files above must not be published. Remove them from the index."
            exit 1
          fi

  host-tests:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-2025
            python: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned YARA and PE parsers
        run: "python -m pip install --require-hashes --only-binary=:all: -r tests/requirements-ci.txt"
      - name: Compile sources
        run: python -m compileall -q re_harness tests
      - name: Require the optional parsers
        run: python -c "import pefile, yara"
      - name: Unit, boundary and Forge tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/unittest.log"
          python -m unittest discover -s tests -v 2>&1 | tee "$log"
          if grep -E 'YaraTests[^)]*\) \.\.\. skipped' "$log"; then
            echo "::error::YARA tests were skipped"
            exit 1
          fi
          grep -qE 'YaraTests[^)]*\) \.\.\. ok' "$log"

  web:
    name: Forge web app build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and build
        working-directory: web
        run: |
          npx tsc --noEmit
          npm run build
      - name: Require the committed build to match its source
        run: |
          if ! git diff --exit-code -- re_harness/forge_web; then
            echo "::error::re_harness/forge_web is stale. Run npm run build in web/ and commit the output."
            exit 1
          fi
          test -z "$(git status --porcelain -- re_harness/forge_web)"
      - name: Keep the build free of inline code
        run: |
          # "! grep" would not fail under bash -e, so test the match explicitly.
          if grep -nE '<script>|<style|style=' re_harness/forge_web/index.html; then exit 1; fi
          # react-dom itself names the prop, so check the app's own source rather than the bundle.
          if grep -rnE 'dangerouslySetInnerHTML|innerHTML|style=\{\{|eval\(' web/src; then exit 1; fi
